<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0C0F" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <title>NTK Cam Studio — Video Presentation & Screen Recorder</title>
    <meta name="description" content="Browser-based video presentation and screen recording studio with real-time canvas compositing, customizable webcam overlays, slide decks, and a hidden teleprompter." />
    <meta property="og:title" content="NTK Cam Studio — Video Presentation & Screen Recorder" />
    <meta property="og:description" content="Browser-based video presentation and screen recording studio with real-time canvas compositing, customizable webcam overlays, slide decks, and a hidden teleprompter." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('ntk-cam-studio-theme');
          var prefersDark =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var resolved =
            pref === 'dark' || pref === 'light' ? pref : prefersDark ? 'dark' : 'light';
          var root = document.documentElement;
          root.classList.toggle('dark', resolved === 'dark');
          root.dataset.theme = resolved;
          root.style.colorScheme = resolved;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', resolved === 'dark' ? '#0B0C0F' : '#FFFFFF');
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[#F3F5F9] dark:bg-[#0B0C0F] text-slate-900 dark:text-[#F4F5F7] antialiased selection:bg-blue-500/30 selection:text-blue-950 dark:selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
